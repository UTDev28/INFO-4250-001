<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pandaBase Security Auditing</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
    }

    /* ── Top navigation bar ── */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
    }

    .nav-brand {
      display: inline-block;
      font-size: 20px;
      font-weight: 700;
      text-decoration: none;
      color: #fff;
    }

    .nav-brand span { color: #4fc978; }

    .nav-buttons {
      display: flex;
      gap: 12px;
    }

    .btn {
      display: inline-block;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      letter-spacing: 0.3px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
    }

    .btn:active { transform: translateY(0); }

    .btn-login {
      background: #4fc978;
      color: #0f2027;
    }

    .btn-register {
      background: transparent;
      color: #fff;
      border: 2px solid rgba(255, 255, 255, 0.35);
    }

    .btn-register:hover {
      border-color: #4fc978;
      color: #4fc978;
    }

    /* ── Hero section ── */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: calc(100vh - 180px);
      padding: 0 20px;
    }

    .hero-logo { font-size: 80px; margin-bottom: 16px; }

    .hero h1 {
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .hero h1 span { color: #4fc978; }

    .hero .tagline {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 32px;
    }

    .hero p.description {
      max-width: 560px;
      font-size: 18px;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 40px;
    }

    .hero .cta {
      padding: 14px 40px;
      font-size: 16px;
      border-radius: 10px;
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 24px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav>
    <a class="nav-brand" href="/">🐼 <span>panda</span>Base</a>
    <div class="nav-buttons">
      <button class="btn btn-register" onclick="alert('Registration is not yet implemented.')">Register</button>
      <button class="btn btn-login" onclick="alert('Login is not yet implemented.')">Log In</button>
    </div>
  </nav>

  <!-- Hero -->
  <section class="hero">
    <div class="hero-logo">🐼</div>
    <h1><span>panda</span>Base</h1>
    <p class="tagline">Security Auditing</p>
    <p class="description">
      Comprehensive database security auditing you can trust. We help teams
      identify vulnerabilities, enforce compliance, and protect sensitive data
      — all from a single platform.
    </p>
    <button class="btn btn-login cta" onclick="window.location.href='/dashboard'">Get Started</button>
  </section>

  <footer>&copy; 2026 pandaBase Security Auditing</footer>

</body>
</html>
